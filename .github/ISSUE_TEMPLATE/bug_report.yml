name: Bug report
description: Create a report to help us improve PII Shield
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! PII Shield is designed to operate 100% offline with zero outbound network calls.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the behavior (never paste real production PII).
      placeholder: |
        1. Run `pii-shield scrub-file ...`
        2. Or call `POST /api/v1/scrub/text` with ...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where are you running PII Shield?
      options:
        - Docker Compose (Official)
        - Standalone Docker Container
        - Local Python 3.11+ / Virtual Environment
        - Kubernetes / Helm
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Please copy and paste any relevant terminal or container logs (sanitize any sensitive values).
      render: shell
