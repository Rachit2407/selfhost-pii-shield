name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies & local spaCy model
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm
      - name: Run pytest suite
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build air-gapped Docker image
        run: docker build -t selfhost-pii-shield:ci .
      - name: Verify compose configuration
        run: docker compose config -q
